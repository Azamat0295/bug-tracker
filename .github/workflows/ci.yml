name: CI

on: 
  push:
    branches:
      - main

    workflow_dispatch:

jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установка go
        uses: actions/setup-go@v5
        with: 
          go-version: "1.21"
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Запуск бэкенд тестов
        working-directory: ./bugtracker-backend
        run: |
          go test -v ./...


  unit-tests-frontend:
    needs: unit-tests-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установка Node.js 
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Запуск фронтенд тестов
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test

      - name: Отчет о тестировании
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Отчет о фронтенд тестировании
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit

