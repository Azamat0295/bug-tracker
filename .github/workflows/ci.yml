name: CI

on: 
  push:
    branches:
      - main

    workflow_dispatch:


jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка go
        uses: actions/setup-go@v4
        with: 
          go-version: "1.21"
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Извлечение бэкенд тестов
        working-directory: ./bugtracker-backend
        run: |
          go test -v ./...